# Literature Tracker settings.
# Edit this file to change what gets tracked — no code changes needed for anything below.

# Free-text description of what's relevant to you. This is sent verbatim into
# both the triage prompt (Haiku, scoring abstracts) and the deep-read prompt
# (Opus, summarizing full papers), so write it like a briefing to a research
# assistant: what you care about, what you don't, and any nuance that would
# help someone judge a borderline paper.
interests: |
  I'm interested in work around fair lending and algorithmic fairness in general, with a 
  particular focus on new debiasing methodologies. Discrimination work can include
  proxy discrimination (Disparate Treatment), Disparate Impact testing, Less Discriminatory
  Alternative Search (LDA Search), and any activities by fairness regulators (CFPB, 
  HUD, FHFA, state agencies). The AI fairness work can be broader - anything to do with 
  debiasing traditional (ex. logistic), machine learning (XGBoost, LightGBM), or LLM 
  models. I am also interested in employment discrimination, explainability techniques for 
  ML models, demographic imputation methods (BISG, HMDA data), and responsible AI in 
  general. I'm OK with interdisciplinary work, but am less interested in econ, fairly 
  interested in law, and most interested in code examples and technical methods (ML, CS). 
  If papers deal with domains outside of credit or employment, that's fine too if they have
  an interesting contribution to fairness measurement or debiasing. A perfect 10 would be a 
  novel debiasing technique for machine learning models that would be applicable to a 
  credit scoring algorithm and comes with example Python code. If a paper is highly 
  responsive to one of my interests it can still be rated highly, even if it doesn't check
  every box. 

arxiv:
  # Plain phrases -- no query syntax needed, just what you'd type into a
  # search box. Any ONE of these appearing in a paper's abstract is enough
  # to include it; these are specific enough on their own that they don't
  # need corroboration.
  specific_keywords:
    - "less discriminatory alternative"
    - "LDA search"
    - "fair lending"
    - "algorithmic fairness"
    - "algorithmic debiasing"
    - "equal credit opportunity act"
    - "fair housing act"
    - "proxy discrimination"
    - "credit discrimination"
    - "Bayesian Improved Surname Geocoding"
    - "Home Mortgage Disclosure Act"
    - "adversarial debiasing"
    - "disparate impact"
    - "disparate treatment"
    - "redlining"
    - "bias mitigation"
    - "adverse action notice"
  # Single words that are individually too broad/overloaded to trust alone
  # -- e.g. plain "discrimination" is common physics/stats vocabulary
  # ("state discrimination," "signal discrimination") unrelated to fair
  # lending. A paper only qualifies via this list if at least 2 of these
  # appear together in the same abstract.
  broad_keywords:
    - "fairness"
    - "bias"
    - "discrimination"
    - "credit"
  # The daily job harvests every arXiv record changed since its last
  # successful run, which includes new versions of old papers. Anything
  # first submitted more than this many days before the harvest window
  # starts is treated as old and skipped. Also how far back the very first
  # harvest reaches (and any harvest after the sheet's harvest_state tab is
  # cleared).
  max_age_days: 7

triage:
  model: "claude-haiku-4-5"
  # Papers scoring >= this (0-10 scale) move on to the deep-read stage.
  score_threshold: 7

deep_read:
  model: "claude-opus-5"
  # Safety-net page cap for PDF extraction -- the real cost-saving happens
  # via a references-heading cut in pdf_extract.py (drops the bibliography
  # and anything after it, e.g. appendices). This cap only exists to bound
  # the rare pathological outlier where that heading can't be trusted (a
  # long thesis-style document with several "References" headings in it).
  # 50 is comfortably above every legitimate paper seen so far (longest is
  # 53 pages) while still cutting a 257-page outlier by ~80%.
  max_pdf_pages: 50

google_sheets:
  # The long ID in your Google Sheet's URL:
  # https://docs.google.com/spreadsheets/d/THIS_PART_HERE/edit
  sheet_id: "15BV2YSCyF3ITNu3omHxPx53VjB5tsvxXqheTJXlFtek"
  papers_tab: "papers"

weekly_report:
  lookback_days: 7
  # recipient_email is NOT set here -- it's read from the REPORT_RECIPIENT_EMAIL
  # env var (see .env.example) so a personal address never ends up committed.
  # Must be an address on a domain verified with Resend, or Resend's shared
  # test sender (onboarding@resend.dev) while you're getting set up.
  sender_email: "onboarding@resend.dev"
  # Used as "{subject_prefix}: {start date} - {end date}" for both the
  # email subject and the in-body title, for lit-weekly and lit-backfill alike.
  subject_prefix: "AI Fairness/Fair Lending Review"

retries:
  # How many times to retry a paper stuck in an error state before giving up
  # on it permanently (it stays in the sheet for manual inspection).
  max_retry_count: 3
