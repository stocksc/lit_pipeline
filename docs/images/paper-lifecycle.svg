<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 422" width="880" height="422" role="img" aria-labelledby="title desc">
  <title id="title">A paper's status in the sheet</title>
  <desc id="desc">A paper starts as ingested and becomes triaged once scored. From triaged it moves to deep_read_complete for scores of 7 or more, mid_summary_complete for scores of 4 to 6, or stays triaged with just its title for scores of 3 or less. When a model call fails, the paper moves to an error status, for example deep_read_error, and is retried on the next run. After the third failure it becomes deep_read_failed_permanent and is parked for a person to review. Triage and mid summaries follow the same pattern.</desc>
  <style>
    .bg { fill: #ffffff; }
    .cluster { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .node { fill: #ffffff; stroke: #afb8c1; stroke-width: 1.5; }
    .ghost { fill: #ffffff; stroke: #afb8c1; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .done { fill: #ecfdf3; stroke: #15803d; stroke-width: 1.5; }
    .warn { fill: #fff8e6; stroke: #b7791f; stroke-width: 1.5; }
    .bad { fill: #fff1f0; stroke: #cf222e; stroke-width: 1.5; }
    .wire { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    .head { fill: #8c959f; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 600; fill: #1f2328; }
    .s { font-size: 13px; fill: #59636e; }
    .lane { font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; fill: #59636e; }
    .edge { font-size: 12px; font-weight: 600; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .cluster { fill: #151b23; stroke: #3d444d; }
      .node, .ghost { fill: #0d1117; stroke: #656c76; }
      .done { fill: #0f2419; stroke: #3fb950; }
      .warn { fill: #2a1f0a; stroke: #d29922; }
      .bad { fill: #2d1215; stroke: #f85149; }
      .wire { stroke: #7d8590; }
      .head { fill: #7d8590; }
      .m { fill: #f0f6fc; }
      .s, .lane, .edge { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="422" rx="16"/>

  <!-- Normal flow -->
  <rect class="cluster" x="20" y="20" width="840" height="200" rx="14"/>
  <text class="lane" x="40" y="48">NORMAL FLOW</text>

  <rect class="node" x="40" y="106" width="150" height="44" rx="22"/>
  <text class="m" x="115" y="133" text-anchor="middle">ingested</text>

  <line class="wire" x1="190" y1="128" x2="268" y2="128" marker-end="url(#arrow)"/>
  <text class="edge" x="229" y="120" text-anchor="middle">triage</text>

  <rect class="node" x="270" y="106" width="150" height="44" rx="22"/>
  <text class="m" x="345" y="133" text-anchor="middle">triaged</text>

  <path class="wire" d="M420 128 H470 V76 H618" marker-end="url(#arrow)"/>
  <path class="wire" d="M420 128 H618" marker-end="url(#arrow)"/>
  <path class="wire" d="M470 128 V180 H618" marker-end="url(#arrow)"/>
  <text class="edge" x="544" y="69" text-anchor="middle">deep read · score ≥ 7</text>
  <text class="edge" x="544" y="121" text-anchor="middle">mid summary · 4–6</text>
  <text class="edge" x="544" y="173" text-anchor="middle">score ≤ 3</text>

  <rect class="done" x="620" y="56" width="220" height="40" rx="20"/>
  <text class="m" x="730" y="81" text-anchor="middle">deep_read_complete</text>
  <rect class="done" x="620" y="108" width="220" height="40" rx="20"/>
  <text class="m" x="730" y="133" text-anchor="middle">mid_summary_complete</text>
  <rect class="ghost" x="620" y="160" width="220" height="40" rx="20"/>
  <text x="730" y="185" text-anchor="middle"><tspan class="m">triaged</tspan><tspan class="s">  (title only)</tspan></text>

  <!-- Failure handling -->
  <rect class="cluster" x="20" y="240" width="840" height="162" rx="14"/>
  <text class="lane" x="40" y="268">WHEN A CALL FAILS</text>
  <text class="s" x="200" y="268">shown for the deep read; triage and mid summary work the same way</text>

  <rect class="node" x="40" y="322" width="150" height="44" rx="22"/>
  <text class="m" x="115" y="349" text-anchor="middle">triaged</text>

  <line class="wire" x1="190" y1="344" x2="268" y2="344" marker-end="url(#arrow)"/>
  <text class="edge" x="229" y="336" text-anchor="middle">call fails</text>

  <rect class="warn" x="270" y="322" width="200" height="44" rx="22"/>
  <text class="m" x="370" y="349" text-anchor="middle">deep_read_error</text>
  <path class="wire" d="M420 322 C420 292, 320 292, 320 320" marker-end="url(#arrow)"/>
  <text class="edge" x="432" y="302">retried on the next run</text>

  <line class="wire" x1="470" y1="344" x2="598" y2="344" marker-end="url(#arrow)"/>
  <text class="edge" x="534" y="336" text-anchor="middle">3rd failure</text>

  <rect class="bad" x="600" y="322" width="240" height="44" rx="22"/>
  <text class="m" x="720" y="349" text-anchor="middle">deep_read_failed_permanent</text>
  <text class="s" x="720" y="388" text-anchor="middle">parked with its error for a person</text>
</svg>
