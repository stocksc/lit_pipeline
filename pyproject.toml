[project]
name = "lit-pipeline"
version = "0.1.0"
description = "Automated arXiv literature tracker: ingest, triage, deep-read, weekly digest."
readme = "README.md"
authors = [
    { name = "Chris", email = "REDACTED" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.122.0",
    "arxiv>=4.0.1",
    "google-auth>=2.56.3",
    "gspread>=6.2.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
lit-daily = "lit_pipeline.daily_pipeline:main"
lit-weekly = "lit_pipeline.weekly_report:main"
lit-backfill = "lit_pipeline.backfill:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pandas>=2.2",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
