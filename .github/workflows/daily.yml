name: Daily literature ingest + triage + deep read

on:
  schedule:
    # 13:00 UTC every day. GitHub may delay scheduled runs under load;
    # that's fine here since the pipeline is fully resumable.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
        run: uv run lit-daily

      # The weekly digest goes out from here, after Monday's ingest, rather
      # than on its own cron: two separately scheduled workflows get delayed
      # by different amounts, and the email used to go out before that day's
      # papers were in. Runs even if the pipeline step failed, so a bad day
      # doesn't swallow the whole week's email. Scheduled runs only -- a
      # manual run on a Monday shouldn't send a second copy (weekly.yml's
      # Run workflow button is the manual way to send one).
      - name: Send weekly report (Mondays)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            uv run lit-weekly
          else
            echo "Not Monday (UTC); skipping the weekly report."
          fi
