name: Daily literature ingest + triage + deep read

on:
  schedule:
    # 13:00 UTC every day. GitHub may delay scheduled runs under load;
    # that's fine here since the pipeline is fully resumable.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: uv run lit-daily
